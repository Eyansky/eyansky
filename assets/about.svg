<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450" role="img" aria-labelledby="title desc"><title id="title">About Ian and his current engineering focus</title><desc id="desc">About Ian and his current engineering focus</desc><rect x="0.75" y="0.75" width="1198.5" height="448.5" rx="18" fill="#161B22" stroke="#30363D" stroke-width="1.5"/><text x="32" y="53" fill="#F0F6FC" font-size="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-weight="600">About me</text><text x="32" y="101" fill="#B1BAC4" font-size="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-weight="400">I&#x27;m a Senior Software Engineer with over a decade of</text><text x="32" y="132" fill="#B1BAC4" font-size="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-weight="400">experience building production software, scalable</text><text x="32" y="163" fill="#B1BAC4" font-size="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-weight="400">backends, and full-stack products.</text><text x="32" y="224" fill="#B1BAC4" font-size="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-weight="400">I care about clean architecture, maintainability,</text><text x="32" y="255" fill="#B1BAC4" font-size="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-weight="400">performance, and the details that make software</text><text x="32" y="286" fill="#B1BAC4" font-size="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-weight="400">dependable.</text><text x="32" y="347" fill="#B1BAC4" font-size="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-weight="400">From the first architecture discussion to production</text><text x="32" y="378" fill="#B1BAC4" font-size="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-weight="400">deployment, I bring craftsmanship, curiosity, and a</text><text x="32" y="409" fill="#B1BAC4" font-size="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-weight="400">focus on creating real value.</text><path d="M624 32V418" stroke="#30363D"/><text x="664" y="53" fill="#F0F6FC" font-size="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-weight="600">Current focus</text><text x="664" y="106" fill="#3DDC97" font-size="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-weight="600">AI products</text><text x="664" y="139" fill="#B1BAC4" font-size="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-weight="400">Building practical AI-enabled experiences.</text><text x="664" y="198" fill="#3DDC97" font-size="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-weight="600">Backend architecture</text><text x="664" y="231" fill="#B1BAC4" font-size="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-weight="400">Designing dependable, maintainable services.</text><text x="664" y="290" fill="#3DDC97" font-size="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-weight="600">Developer tools</text><text x="664" y="323" fill="#B1BAC4" font-size="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-weight="400">Automating workflows; improving engineering quality.</text><text x="664" y="382" fill="#3DDC97" font-size="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-weight="600">Product engineering</text><text x="664" y="415" fill="#B1BAC4" font-size="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-weight="400">Taking ideas from concept to production.</text></svg>
