<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1030" viewBox="0 0 600 1030" role="img" aria-labelledby="title desc"><title id="title">About Ian and his current engineering focus</title><desc id="desc">About Ian and his current engineering focus</desc><rect x="0.75" y="0.75" width="598.5" height="1028.5" rx="18" fill="#161B22" stroke="#30363D" stroke-width="1.5"/><text x="32" y="53" fill="#F0F6FC" font-size="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-weight="600">About me</text><text x="32" y="102" fill="#B1BAC4" font-size="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-weight="400">I&#x27;m a Senior Software Engineer with over a</text><text x="32" y="136" fill="#B1BAC4" font-size="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-weight="400">decade of experience building production</text><text x="32" y="170" fill="#B1BAC4" font-size="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-weight="400">software, scalable backends, and full-stack</text><text x="32" y="204" fill="#B1BAC4" font-size="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-weight="400">products.</text><text x="32" y="263" fill="#B1BAC4" font-size="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-weight="400">I care about clean architecture, maintainability,</text><text x="32" y="297" fill="#B1BAC4" font-size="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-weight="400">performance, and the details that make</text><text x="32" y="331" fill="#B1BAC4" font-size="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-weight="400">software dependable.</text><text x="32" y="390" fill="#B1BAC4" font-size="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-weight="400">From the first architecture discussion to the</text><text x="32" y="424" fill="#B1BAC4" font-size="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-weight="400">production deployment, I bring craftsmanship,</text><text x="32" y="458" fill="#B1BAC4" font-size="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-weight="400">curiosity, and a focus on creating real value.</text><path d="M32 525H568" stroke="#30363D"/><text x="32" y="582" fill="#F0F6FC" font-size="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-weight="600">Current focus</text><text x="32" y="635" fill="#3DDC97" font-size="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-weight="600">AI products</text><text x="32" y="669" fill="#B1BAC4" font-size="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-weight="400">Building practical AI-enabled experiences.</text><text x="32" y="729" fill="#3DDC97" font-size="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-weight="600">Backend architecture</text><text x="32" y="763" fill="#B1BAC4" font-size="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-weight="400">Designing dependable, maintainable services.</text><text x="32" y="823" fill="#3DDC97" font-size="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-weight="600">Developer tools</text><text x="32" y="857" fill="#B1BAC4" font-size="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-weight="400">Automating workflows and improving</text><text x="32" y="889" fill="#B1BAC4" font-size="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-weight="400">engineering quality.</text><text x="32" y="949" fill="#3DDC97" font-size="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-weight="600">Product engineering</text><text x="32" y="983" fill="#B1BAC4" font-size="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-weight="400">Taking ambitious ideas from concept</text><text x="32" y="1015" fill="#B1BAC4" font-size="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-weight="400">to production.</text></svg>
