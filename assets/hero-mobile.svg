<svg xmlns="http://www.w3.org/2000/svg" width="600" height="680" viewBox="0 0 600 680" role="img" aria-labelledby="title desc"><title id="title">Hi, I&#x27;m Ian. I build software that works beautifully at scale.</title><desc id="desc">Hi, I&#x27;m Ian. I build software that works beautifully at scale.</desc><rect x="0.75" y="0.75" width="598.5" height="678.5" rx="18" fill="#0D1117" stroke="#30363D" stroke-width="1.5"/><text x="32" y="60" fill="#F0F6FC" font-size="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-weight="650">Hi, I&#x27;m Ian.</text><text x="32" y="112" fill="#F0F6FC" font-size="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-weight="400">I build software that works</text><text x="32" y="161" fill="#3DDC97" font-size="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-weight="400">beautifully at scale.</text><text x="32" y="217" fill="#B1BAC4" font-size="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-weight="400">Senior Software Engineer</text><text x="32" y="251" fill="#B1BAC4" font-size="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-weight="400">Backend, Full-Stack &amp; AI Systems</text><text x="32" y="303" fill="#B1BAC4" font-size="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-weight="400">10+ years turning ideas into reliable systems</text><text x="32" y="336" fill="#B1BAC4" font-size="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-weight="400">and products. Still excited by every great</text><text x="32" y="369" fill="#B1BAC4" font-size="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-weight="400">problem worth solving.</text><g transform="translate(122 400) scale(.96)">
